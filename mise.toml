[env]
RUST_LOG = 'debug'
SWAY_CONFIG = 'sway-config'

[tasks.build]
run = 'cargo build'
alias = 'b'

[tasks.build-release]
run = 'cargo build --release'
alias = 'br'

[tasks.test]
run = 'cargo test'
alias = 't'

[tasks.test-release]
run = 'cargo test --release'
alias = 'tr'

[tasks.run-daemon]
run = 'cargo run --bin wgpaper-daemon-http'
alias = 'rd'

[tasks.run-daemon-release]
run = 'cargo run --bin wgpaper-daemon-http --release'
alias = 'rdr'

[tasks.run-daemon-sway]
usage = '''
arg "<output_count>" default="1"
'''
# mise has no `pattern`/`choices` for args, so the count is validated here:
# a bogus value is accepted by wlroots and yields a half-broken session.
run = 'case "${usage_output_count}" in (""|*[!0-9]*) echo "rds: output count must be a positive number, got: ${usage_output_count}" >&2; exit 2;; esac; WGPAPER_PROJECT_COMMAND="mise rd" WLR_WL_OUTPUTS=${usage_output_count} sway -c $SWAY_CONFIG'
alias = 'rds'

[tasks.run-daemon-sway-release]
usage = '''
arg "<output_count>" default="1"
'''
run = 'case "${usage_output_count}" in (""|*[!0-9]*) echo "rdsr: output count must be a positive number, got: ${usage_output_count}" >&2; exit 2;; esac; WGPAPER_PROJECT_COMMAND="mise rdr" WLR_WL_OUTPUTS=${usage_output_count} sway -c $SWAY_CONFIG'
alias = 'rdsr'

[tasks.sway-exec]
# No `usage` spec on purpose: mise then forwards the arguments verbatim.
# With a spec, ${usage_command} is interpolated into a shell string, which
# mangles quotes and whitespace. The `--` stops nu from parsing flags of the
# command that is to be run (e.g. `mise sx -- ls -l`).
run = 'nu sway-env.nu --'
alias = 'sx'

[tasks.reset-failed-systemd]
usage = '''
arg "<unit_name>"
'''
run = 'systemctl --user reset-failed ${usage_unit_name}'
alias = 'rfs'

[tasks.run-systemd]
usage = '''
arg "<unit_name>"
arg "<command>" var=#true
'''
# `reset-failed` is a no-op when the unit was never loaded, but through a nested
# `mise` task that still prints an ERROR line, hence the direct systemctl call.
run = 'systemctl --user reset-failed ${usage_unit_name} >/dev/null 2>&1 || true; systemd-run --user -d -E WAYLAND_DISPLAY=$WAYLAND_DISPLAY -p SyslogIdentifier=${usage_unit_name} -u ${usage_unit_name} ${usage_command}'
alias = 'rs'

[tasks.systemd-logs]
usage = '''
arg "<unit_name>"
'''
run = 'journalctl --user -t ${usage_unit_name}' # Apparently, `journalctl --user -u <unit_name>` is not a correct filter on some systems, so we use an identifier.
alias = 'sl'

[tasks.status-systemd]
usage = '''
arg "<unit_name>"
'''
run = 'systemctl --user status ${usage_unit_name}'
alias = 'sts'

[tasks.stop-systemd]
usage = '''
arg "<unit_name>"
'''
run = 'systemctl --user stop ${usage_unit_name}'
alias = 'ss'

[tasks.run-systemd-daemon]
usage = '''
arg "<unit_name>" default="wgpaper-rd"
'''
run = 'mise rs ${usage_unit_name} mise rd'
alias = 'rsd'

[tasks.systemd-daemon-logs]
usage = '''
arg "<unit_name>" default="wgpaper-rd"
'''
run = 'mise sl ${usage_unit_name}'
alias = 'sdl'

[tasks.status-systemd-daemon]
usage = '''
arg "<unit_name>" default="wgpaper-rd"
'''
run = 'mise sts ${usage_unit_name}'
alias = 'stsd'

[tasks.stop-systemd-daemon]
usage = '''
arg "<unit_name>" default="wgpaper-rd"
'''
run = 'mise ss ${usage_unit_name}'
alias = 'ssd'

[tasks.run-systemd-daemon-release]
usage = '''
arg "<unit_name>" default="wgpaper-rdr"
'''
run = 'mise rs ${usage_unit_name} mise rdr'
alias = 'rsdr'

[tasks.systemd-daemon-logs-release]
usage = '''
arg "<unit_name>" default="wgpaper-rdr"
'''
run = 'mise sl ${usage_unit_name}'
alias = 'sdlr'

[tasks.status-systemd-daemon-release]
usage = '''
arg "<unit_name>" default="wgpaper-rdr"
'''
run = 'mise sts ${usage_unit_name}'
alias = 'stsdr'

[tasks.stop-systemd-daemon-release]
usage = '''
arg "<unit_name>" default="wgpaper-rdr"
'''
run = 'mise ss ${usage_unit_name}'
alias = 'ssdr'

[tasks.run-systemd-daemon-sway]
usage = '''
arg "<output_count>" default="1"
arg "<unit_name>" default="wgpaper-rds"
'''
run = 'mise rs ${usage_unit_name} mise rds ${usage_output_count}'
alias = 'rsds'

[tasks.systemd-daemon-sway-logs]
usage = '''
arg "<unit_name>" default="wgpaper-rds"
'''
run = 'mise sl ${usage_unit_name}'
alias = 'sdsl'

[tasks.status-systemd-daemon-sway]
usage = '''
arg "<unit_name>" default="wgpaper-rds"
'''
run = 'mise sts ${usage_unit_name}'
alias = 'stsds'

[tasks.stop-systemd-daemon-sway]
usage = '''
arg "<unit_name>" default="wgpaper-rds"
'''
run = 'mise ss ${usage_unit_name}'
alias = 'ssds'

[tasks.run-systemd-daemon-sway-release]
usage = '''
arg "<output_count>" default="1"
arg "<unit_name>" default="wgpaper-rdsr"
'''
run = 'mise rs ${usage_unit_name} mise rdsr ${usage_output_count}'
alias = 'rsdsr'

[tasks.systemd-daemon-sway-logs-release]
usage = '''
arg "<unit_name>" default="wgpaper-rdsr"
'''
run = 'mise sl ${usage_unit_name}'
alias = 'sdslr'

[tasks.status-systemd-daemon-sway-release]
usage = '''
arg "<unit_name>" default="wgpaper-rdsr"
'''
run = 'mise sts ${usage_unit_name}'
alias = 'stsdsr'

[tasks.stop-systemd-daemon-sway-release]
usage = '''
arg "<unit_name>" default="wgpaper-rdsr"
'''
run = 'mise ss ${usage_unit_name}'
alias = 'ssdsr'

[tasks.list-units]
# Transient units vanish once they finish, so this is the only way to tell
# which session is actually still running.
run = 'systemctl --user list-units --all --no-pager "wgpaper-*" || true'
alias = 'lu'

[tasks.kill-daemons]
# A killed compositor leaves its daemon behind: the daemon logs a broken pipe
# and keeps serving. `-x` matches the process name, so this task cannot kill
# itself, and the name is truncated to 15 characters by the kernel.
run = 'pkill -x wgpaper-daemon- && echo "killed stray daemons" || echo "no stray daemons"'
alias = 'kd'

[tasks.cleanup]
# The one command that gets rid of everything a session can leave behind:
# transient units, orphaned daemons and the stale sway env dump.
run = '''
units=$(systemctl --user list-units --all --plain --no-legend "wgpaper-*" | awk '{print $1}')
if [ -n "$units" ]; then echo "stopping units: $units"; systemctl --user stop $units || true; else echo "no wgpaper units running"; fi
pkill -x wgpaper-daemon- && echo "killed stray daemons" || echo "no stray daemons"
rm -f "${WGPAPER_SWAY_ENV_FILE:-${XDG_RUNTIME_DIR:-/tmp}/wgpaper-sway.env}" && echo "removed the sway env file"
'''
alias = 'clean'

[tasks.fmt]
run = 'cargo fmt'
alias = 'f'

[tasks.clippy]
run = 'cargo clippy'
alias = 'c'

[tasks.clippy-fix]
run = 'cargo clippy --fix'
alias = 'cf'

[tasks.clippy-fix-dirty]
run = 'cargo clippy --fix --allow-dirty'
alias = 'cfd'
