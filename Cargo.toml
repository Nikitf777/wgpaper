[workspace]
resolver = "3"
members = [
	"lib-wgpaper-daemon",
	"wgpaper-abi",
	"wgpaper-config",
	"wgpaper-daemon-http",
	"wgpaper-shaders",
]

[workspace.lints.rust]
# `spirv` is a real `target_arch`, but it is only known to the rust-gpu fork of
# rustc, so stock rustc's `--check-cfg` does not list it and warns about every
# use. Teaching the checker the value keeps `unexpected_cfgs` useful for cfg
# names that really are wrong, rather than silencing the lint wholesale.
#
# Crates that target the SPIR-V backend opt in with `[lints] workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[workspace.dependencies]
anyhow = "1.0.100"
thiserror = "2.0.18"
log = "0.4.29"
env_logger = "0.11.9"
dotenvy = "0.15.7"
tokio = "1.49.0"
const_format = "0.2.35"
calloop = "0.14.3"
csscolorparser = { version = "0.8.2", features = ["serde"] }
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu", tag = "v0.10.0" }
spirv-std = { git = "https://github.com/Rust-GPU/rust-gpu", tag = "v0.10.0" }

[profile.dev]
opt-level = 3
